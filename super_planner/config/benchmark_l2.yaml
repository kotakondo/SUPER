traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    constraint_norm_type: 0  # 0: L2, 1: L-inf
    max_vel: 1.0
    max_acc: 2.0
    max_jerk: 3.0
    max_omg: 2.5
    max_acc_thr: 5.0
    min_acc_thr: 0.0
    penna_margin: 0.01

  exp_traj:
    pos_constraint_type: 1
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg: 0.0
    penna_max_acc_thr: 0.0
    penna_min_acc_thr: 0.0

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81
